name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every job name here is a required check on main. Renaming one silently stops
# requiring it, so update the ruleset in the same change.

# Actions are pinned to a commit SHA because a tag can be moved after review.

# Read-only: nothing here pushes, comments or publishes.
permissions:
  contents: read

# A new push makes a PR's previous run irrelevant. Main is never cancelled, so
# every merged commit keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every version composer.json allows. Add the next minor on its release day,
        # not after a bug report from someone running it.
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # Exact dev pins make an advisory against one actionable.
      - name: Audit dependencies
        run: composer audit

      # Each check is the composer script contributors run locally, with extra flags
      # passed after `--`, so CI and a local run cannot drift apart.
      - name: Check code style
        run: composer cs

      - name: Static analysis
        run: composer stan -- --no-progress

      # A floor rather than a printed percentage, which lets coverage rot.
      - name: Tests and coverage floor
        run: composer coverage

      # Coverage proves a line ran; mutation testing proves an assertion noticed it change.
      - name: Mutation testing
        run: composer mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-report-php-${{ matrix.php }}
          path: build/infection/
          if-no-files-found: ignore
          retention-days: 14

  jit:
    # The JIT compiles float arithmetic down a separate code path; an exact algorithm must not notice.
    # No coverage driver here, because xdebug turns the JIT off.
    name: PHP 8.5 (JIT)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          ini-values: opcache.enable_cli=1, opcache.jit=tracing, opcache.jit_buffer_size=64M

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # A silently disabled JIT would make this job a copy of the matrix.
      - name: Confirm the JIT is on
        run: php -r 'exit(opcache_get_status()["jit"]["on"] ?? false ? 0 : 1);'

      - name: Tests
        run: composer test

  complexity:
    # Syntax-only, so one run covers every PHP version.
    name: Cognitive complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: bonsai-lint
        run: composer complexity

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact release, so new audits arrive with a deliberate bump, not an unrelated PR.
      - name: Install zizmor
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: zizmor@1.30.1

      # The token lets zizmor verify that each pinned commit belongs to its action's repository.
      - name: zizmor
        run: zizmor --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by digest because Dependabot does not track images in `run:` steps.
      # The image bundles ShellCheck, which lints every `run:` script.
      - name: Lint workflows
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Spell check
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
